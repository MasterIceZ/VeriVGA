<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1962 1962" width="1962" height="1962">
  <defs>
    <!-- Main chip body: teal (bottom-left) to lime-yellow (top-right) -->
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="593" y1="1369" x2="1369" y2="593">
      <stop offset="0" stop-color="#5fd8c8"/>
      <stop offset="1" stop-color="#e6f24a"/>
    </linearGradient>
    <!-- Middle square: blue to cyan -->
    <linearGradient id="core" gradientUnits="userSpaceOnUse" x1="780" y1="1180" x2="1181" y2="780">
      <stop offset="0" stop-color="#1f5cff"/>
      <stop offset="0.55" stop-color="#14b4ff"/>
      <stop offset="1" stop-color="#10c4ff"/>
    </linearGradient>
    <!-- Inner square: pink to yellow -->
    <linearGradient id="die" gradientUnits="userSpaceOnUse" x1="880" y1="1081" x2="1081" y2="880">
      <stop offset="0" stop-color="#ff168f"/>
      <stop offset="0.5" stop-color="#ff8a3a"/>
      <stop offset="1" stop-color="#fff21a"/>
    </linearGradient>
    <!-- Small dots / pads -->
    <linearGradient id="dot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#62d8c6"/>
      <stop offset="1" stop-color="#d9f04f"/>
    </linearGradient>
    <!-- Left straight pins -->
    <linearGradient id="pinL" gradientUnits="userSpaceOnUse" x1="385" y1="0" x2="593" y2="0">
      <stop offset="0" stop-color="#ff168f"/>
      <stop offset="0.5" stop-color="#ff9a33"/>
      <stop offset="1" stop-color="#ffd21f"/>
    </linearGradient>
    <!-- Right straight pins -->
    <linearGradient id="pinR" gradientUnits="userSpaceOnUse" x1="1369" y1="1180" x2="1577" y2="780">
      <stop offset="0" stop-color="#ff168f"/>
      <stop offset="0.5" stop-color="#ff8a3a"/>
      <stop offset="1" stop-color="#fff200"/>
    </linearGradient>
    <!-- Bent pins: blue at outer end on the left, cyan at outer end on the right -->
    <linearGradient id="bendTL" x1="0" y1="0" x2="0.7" y2="0.7">
      <stop offset="0" stop-color="#1f5cff"/>
      <stop offset="1" stop-color="#10c4ff"/>
    </linearGradient>
    <linearGradient id="bendBL" x1="0" y1="1" x2="0.7" y2="0.3">
      <stop offset="0" stop-color="#1f5cff"/>
      <stop offset="1" stop-color="#10c4ff"/>
    </linearGradient>
    <linearGradient id="bendTR" x1="1" y1="0" x2="0.3" y2="0.7">
      <stop offset="0" stop-color="#10c4ff"/>
      <stop offset="1" stop-color="#1f6aff"/>
    </linearGradient>
    <linearGradient id="bendBR" x1="1" y1="1" x2="0.3" y2="0.3">
      <stop offset="0" stop-color="#10c4ff"/>
      <stop offset="1" stop-color="#1f6aff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1962" height="1962" fill="#370350"/>

  <g fill="none" stroke-width="37" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top straight pins -->
    <line x1="808"  y1="404" x2="808"  y2="593" stroke="#ff168f"/>
    <line x1="923"  y1="404" x2="923"  y2="593" stroke="#ff7a50"/>
    <line x1="1038" y1="404" x2="1038" y2="593" stroke="#ffb42a"/>
    <line x1="1153" y1="404" x2="1153" y2="593" stroke="#fff000"/>
    <!-- Bottom straight pins -->
    <line x1="808"  y1="1369" x2="808"  y2="1558" stroke="#ff168f"/>
    <line x1="923"  y1="1369" x2="923"  y2="1558" stroke="#ff7a50"/>
    <line x1="1038" y1="1369" x2="1038" y2="1558" stroke="#ffb42a"/>
    <line x1="1153" y1="1369" x2="1153" y2="1558" stroke="#fff000"/>
    <!-- Left straight pins -->
    <g stroke="url(#pinL)">
      <line x1="404" y1="806"  x2="593" y2="806"/>
      <line x1="404" y1="920"  x2="593" y2="920"/>
      <line x1="404" y1="1035" x2="593" y2="1035"/>
      <line x1="404" y1="1149" x2="593" y2="1149"/>
    </g>
    <!-- Right straight pins -->
    <g stroke="url(#pinR)">
      <line x1="1369" y1="806"  x2="1558" y2="806"/>
      <line x1="1369" y1="920"  x2="1558" y2="920"/>
      <line x1="1369" y1="1035" x2="1558" y2="1035"/>
      <line x1="1369" y1="1149" x2="1558" y2="1149"/>
    </g>

    <!-- Bent corner pins -->
    <path d="M603 398 L667 445 Q688 461 688 487 V593"     stroke="url(#bendTL)"/>
    <path d="M396 610 L446 677 Q458 690 478 690 H593"     stroke="url(#bendTL)"/>
    <path d="M1359 398 L1295 445 Q1274 461 1274 487 V593" stroke="url(#bendTR)"/>
    <path d="M1566 610 L1516 677 Q1504 690 1484 690 H1369" stroke="url(#bendTR)"/>
    <path d="M603 1564 L667 1517 Q688 1501 688 1475 V1369" stroke="url(#bendBL)"/>
    <path d="M396 1352 L446 1285 Q458 1272 478 1272 H593"  stroke="url(#bendBL)"/>
    <path d="M1359 1564 L1295 1517 Q1274 1501 1274 1475 V1369" stroke="url(#bendBR)"/>
    <path d="M1566 1352 L1516 1285 Q1504 1272 1484 1272 H1369" stroke="url(#bendBR)"/>

    <!-- Chip body and inner squares -->
    <rect x="611.5" y="611.5" width="739" height="739" stroke="url(#body)"/>
    <rect x="799"   y="798"   width="363" height="363" stroke="url(#core)" stroke-width="38"/>
    <rect x="898.5" y="897.5" width="164" height="164" stroke="url(#die)"/>
  </g>

  <!-- Square pads around the core (8 x 8 perimeter) -->
  <g fill="url(#dot)">
    <!-- top row -->
    <rect x="715" y="710" width="27" height="27"/>
    <rect x="787" y="710" width="27" height="27"/>
    <rect x="860" y="710" width="27" height="27"/>
    <rect x="932" y="710" width="27" height="27"/>
    <rect x="1005" y="710" width="27" height="27"/>
    <rect x="1077" y="710" width="27" height="27"/>
    <rect x="1150" y="710" width="27" height="27"/>
    <rect x="1222" y="710" width="27" height="27"/>
    <!-- bottom row -->
    <rect x="715" y="1222" width="27" height="27"/>
    <rect x="787" y="1222" width="27" height="27"/>
    <rect x="860" y="1222" width="27" height="27"/>
    <rect x="932" y="1222" width="27" height="27"/>
    <rect x="1005" y="1222" width="27" height="27"/>
    <rect x="1077" y="1222" width="27" height="27"/>
    <rect x="1150" y="1222" width="27" height="27"/>
    <rect x="1222" y="1222" width="27" height="27"/>
    <!-- left column -->
    <rect x="715" y="783" width="27" height="27"/>
    <rect x="715" y="856" width="27" height="27"/>
    <rect x="715" y="928" width="27" height="27"/>
    <rect x="715" y="1001" width="27" height="27"/>
    <rect x="715" y="1073" width="27" height="27"/>
    <rect x="715" y="1146" width="27" height="27"/>
    <!-- right column -->
    <rect x="1222" y="783" width="27" height="27"/>
    <rect x="1222" y="856" width="27" height="27"/>
    <rect x="1222" y="928" width="27" height="27"/>
    <rect x="1222" y="1001" width="27" height="27"/>
    <rect x="1222" y="1073" width="27" height="27"/>
    <rect x="1222" y="1146" width="27" height="27"/>
  </g>

  <!-- Corner dot trails -->
  <g fill="url(#dot)">
    <circle cx="467" cy="467" r="21"/>
    <circle cx="515" cy="515" r="21"/>
    <circle cx="563" cy="563" r="21"/>

    <circle cx="1495" cy="467" r="21"/>
    <circle cx="1447" cy="515" r="21"/>
    <circle cx="1399" cy="563" r="21"/>

    <circle cx="467" cy="1495" r="21"/>
    <circle cx="515" cy="1447" r="21"/>
    <circle cx="563" cy="1399" r="21"/>

    <circle cx="1495" cy="1495" r="21"/>
    <circle cx="1447" cy="1447" r="21"/>
    <circle cx="1399" cy="1399" r="21"/>
  </g>
</svg>
